<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b2bd6">
<title>Hazel Party 🐾</title>
<link rel="icon" href="art/hazel.png">
<link rel="apple-touch-icon" href="art/hazel.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="fxlayer"></div>

  <!-- TITLE -->
  <section class="screen" id="s-title">
    <div class="titlebg"></div>
    <div class="titlebtns">
      <div class="who">I am…</div>
      <div class="charpick">
        <button class="pick" data-c="ralph"><img src="art/ralph.png"><span>Ralph</span></button>
        <button class="pick" data-c="jordan"><img src="art/jordan.png"><span>Jordan</span></button>
      </div>
      <button class="big green" id="b-bot">🤖 Play vs Hazel Bot</button>
      <div class="srvmsg" id="t-srv"></div>
      <button class="big yellow" id="b-create">🎉 Create Party</button>
      <div class="joinrow"><input id="i-code" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off"><button class="big blue" id="b-join">Join</button></div>
      <div class="err" id="t-err"></div>
    </div>
  </section>

  <!-- LOBBY -->
  <section class="screen sky" id="s-lobby">
    <div class="panel pop">
      <div class="lbl">Party code</div>
      <div class="code" id="t-code">----</div>
      <button class="mid purple" id="b-share">📤 Share invite link</button>
      <div class="vs">
        <div class="slot" id="slot0"></div><div class="vstxt">VS</div><div class="slot" id="slot1"></div>
      </div>
      <div class="hostonly">
        <div class="lbl">First to…</div>
        <div class="seg" id="seg-target"><button data-v="3">3</button><button data-v="5">5</button><button data-v="7">7</button><button data-v="10">10</button></div>
        <label class="toggle"><input type="checkbox" id="c-chess"><span>♟️ Include Chess round</span></label>
        <button class="mid ghost" id="b-swap">🔄 Swap characters</button>
        <button class="big green" id="b-start" disabled>Waiting for player 2…</button>
      </div>
      <div class="guestonly lbl" id="t-guestwait">Waiting for the host to start…</div>
    </div>
  </section>

  <!-- INTRO -->
  <section class="screen burst" id="s-intro">
    <div class="intro">
      <div class="introchar left" id="ic0"></div>
      <div class="introvs">VS</div>
      <div class="introchar right" id="ic1"></div>
      <div class="introhazel"><img src="art/hazel.png"><div class="bubble">WOOF! Let's party!</div></div>
    </div>
  </section>

  <!-- PICK -->
  <section class="screen burst" id="s-pick">
    <div class="pickhdr">Round <span id="t-round">1</span></div>
    <div class="wheel"><div class="strip" id="strip"></div></div>
    <div class="pickname" id="t-pickname"></div>
  </section>

  <!-- TUTORIAL -->
  <section class="screen sky" id="s-tut">
    <div class="panel card pop">
      <div class="tuticon" id="t-tuticon"></div>
      <div class="tutname" id="t-tutname"></div>
      <ul class="tutlist" id="t-tutlist"></ul>
      <div class="readyrow" id="readyrow"></div>
      <button class="big green" id="b-ready">I'm Ready!</button>
      <button class="mid ghost" id="b-skip">🎲 Skip this game</button>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud">
    <div class="hp" id="hp0"><img><div><b></b><i></i></div></div>
    <div class="htimer" id="htimer"></div>
    <div class="hp r" id="hp1"><img><div><b></b><i></i></div></div>
  </div>
  <div id="controls"></div>
  <div id="banner"></div>
  <div id="countdown"></div>

  <!-- RESULT -->
  <section class="screen burst" id="s-result">
    <div class="restitle" id="t-restitle"></div>
    <div class="reswinner" id="reswinner"></div>
    <div class="board" id="scoreboard"></div>
  </section>

  <!-- FINAL -->
  <section class="screen burst gold" id="s-final">
    <div class="crown">👑</div>
    <div class="restitle" id="t-champ"></div>
    <div class="reswinner big" id="champimg"></div>
    <div class="board" id="finalboard"></div>
    <button class="big yellow" id="b-rematch">🔁 Rematch!</button>
    <div class="lbl" id="t-rematchwait"></div>
  </section>

  <button id="b-mute" class="roundbtn">🔊</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="audio.js"></script>
<script src="offline.js"></script>
<script src="game.js"></script>
</body></html>
